<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Lost in Space</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: radial-gradient(circle at center, #1b2735 0%, #090a0f 100%);
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            overflow: hidden;
            padding: 20px;
        }
        .error-code {
            font-size: 8rem;
            font-weight: 900;
            letter-spacing: 8px;
            background: linear-gradient(45deg, #00f2fe, #4facfe, #f093fb);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: float 3s ease-in-out infinite;
        }
        .subtitle {
            font-size: 1.6rem;
            margin: 15px 0 10px;
            color: #e2e8f0;
        }
        .description {
            font-size: 1rem;
            color: #94a3b8;
            max-width: 460px;
            margin-bottom: 30px;
            line-height: 1.6;
        }
        .btn {
            padding: 12px 28px;
            background: linear-gradient(90deg, #4facfe 0%, #00f2fe 100%);
            color: #090a0f;
            font-weight: 700;
            text-decoration: none;
            border-radius: 30px;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(79, 172, 254, 0.4);
        }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }
    </style>
</head>
<body>
    <div class="error-code">404</div>
    <h1 class="subtitle">Ceci n'est pas une page</h1>
    <p class="description">
        Looks like you drifted off course into uncharted space. The page you are looking for does not exist or has been moved.
    </p>
    <a href="/" class="btn">Return to Home Base</a>
</body>
</html>
